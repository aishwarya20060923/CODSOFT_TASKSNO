{% extends "base.html" %}

{% block title %}Recruiter Registration - CareerHub{% endblock %}

{% block content %}
<div class="container">
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <span class="badge badge-role" style="margin-bottom: 8px;">Employer Portal</span>
        <h2>Register as Recruiter</h2>
        <p>Post vacancies and connect with verified candidates</p>
      </div>

      <form action="{{ url_for('recruiter_register') }}" method="POST">
        <div class="form-group">
          <label class="form-label" for="full_name">Hiring Manager Name *</label>
          <input type="text" id="full_name" name="full_name" class="form-control" placeholder="e.g. Sarah Jenkins" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="company">Company / Organization *</label>
          <input type="text" id="company" name="company" class="form-control" placeholder="e.g. TechNova Solutions" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Work Email *</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="hiring@company.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password *</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="At least 6 characters" minlength="6" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">Confirm Password *</label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Repeat your password" minlength="6" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 10px;">
          Create Recruiter Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--slate-100); font-size: 0.9rem; color: var(--slate-600);">
        Already have a recruiter account? <a href="{{ url_for('recruiter_login') }}" style="font-weight: 600;">Log In</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
